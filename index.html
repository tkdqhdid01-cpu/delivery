<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>알맹샵 배송 정보 관리</title>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: #f4f5f7; margin: 0; padding: 16px; }
    .card { background: #fff; border-radius: 14px; padding: 24px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 420px; margin: 0 auto; position: relative; }
    h2 { font-size: 18px; text-align: center; margin-top: 0; margin-bottom: 20px; color: #111; }
    label { display: block; font-size: 13px; font-weight: 600; color: #4b5563; margin-top: 14px; }
    input[type="text"], input[type="tel"] { width: 100%; height: 46px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 12px; margin-top: 6px; box-sizing: border-box; font-size: 15px; outline: none; }
    input[type="text"]:focus, input[type="tel"]:focus { border-color: #3b82f6; }
    .search-btn { width: 100%; height: 44px; background: #374151; color: #fff; border: none; border-radius: 8px; margin-top: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .guide-txt { font-size: 11px; color: #888; margin-top: 4px; }

    .agree-wrap { display: flex; align-items: center; margin-top: 20px; padding: 12px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; cursor: pointer; }
    .agree-wrap input[type="checkbox"] { width: 18px; height: 18px; margin: 0 10px 0 0; accent-color: #FEE500; cursor: pointer; }
    .agree-wrap span { font-size: 13px; color: #1f2937; font-weight: 500; cursor: pointer; }

    .submit-btn { width: 100%; height: 50px; background: #FEE500; color: #000; border: none; border-radius: 8px; margin-top: 18px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .submit-btn:disabled { background: #e5e7eb; color: #6b7280; cursor: not-allowed; }

    #layerWrap {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    #layerBox {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 480px;
    }
    #postcodeLayer {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    #btnCloseLayer {
      position: absolute;
      right: 0;
      top: -42px;
      width: 32px;
      height: 32px;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      line-height: 32px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="formTitle">🚚 알맹샵 배송 정보 등록</h2>
    <form id="deliveryForm">
      <label>입금자명 (받으시는 분 성함)</label>
      <input type="text" id="customer_name" placeholder="홍길동" required>

      <label>연락처 (휴대폰 11자리)</label>
      <input type="tel" id="phone_number" placeholder="010-1234-5678" maxlength="13" required>

      <label>주소</label>
      <button type="button" class="search-btn" onclick="openDaumPostcode()">🔍 주소 검색하기</button>
      <input type="text" id="base_address" placeholder="기본 주소가 자동 입력됩니다" readonly style="background:#f3f4f6; cursor:pointer;" onclick="openDaumPostcode()" required>
      <input type="text" id="detail_address" placeholder="상세주소 입력 (예: 101동 202호)" required>
      <div class="guide-txt">* 정확한 배송을 위해 상세주소(동/호수)까지 꼭 적어주세요.</div>

      <label class="agree-wrap">
        <input type="checkbox" id="privacy_agree" required checked>
        <span>(필수) 개인정보 수집 및 배송 정보 제공에 동의합니다.</span>
      </label>

      <button type="submit" class="submit-btn" id="submitBtn">등록하기</button>
    </form>
  </div>

  <div id="layerWrap">
    <div id="layerBox">
      <button type="button" id="btnCloseLayer" onclick="closeDaumPostcode()">✕</button>
      <div id="postcodeLayer"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://utgmqhwnztpvsvnxxlsd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_KsWWBm4ekQXEo_aobNuxfA_uC6hdn5w";

    const urlParams = new URLSearchParams(window.location.search);
    const kakaoUserId = (urlParams.get('uid') || "").trim();

    const nameInput = document.getElementById('customer_name');
    const phoneInput = document.getElementById('phone_number');
    const baseAddrInput = document.getElementById('base_address');
    const detailAddrInput = document.getElementById('detail_address');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const privacyAgree = document.getElementById('privacy_agree');
    const layerWrap = document.getElementById('layerWrap');
    const postcodeLayer = document.getElementById('postcodeLayer');

    let isExistingCustomer = false;

    if (!kakaoUserId) {
      submitBtn.disabled = true;
      submitBtn.innerText = "챗봇의 버튼으로 접속해 주세요";
    } else {
      // 기존 등록 고객인지 Supabase에서 미리 확인 후 자동 완성(Pre-fill)
      fetch(`${SUPABASE_URL}/rest/v1/customers?kakao_user_id=eq.${encodeURIComponent(kakaoUserId)}&select=customer_name,phone_number,full_address`, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      })
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          isExistingCustomer = true;
          const c = data[0];
          formTitle.innerText = "✏️ 알맹샵 배송 정보 변경";
          submitBtn.innerText = "변경 완료하기";
          if (c.customer_name) nameInput.value = c.customer_name;
          if (c.phone_number) phoneInput.value = c.phone_number;
          if (c.full_address) baseAddrInput.value = c.full_address;
        }
      })
      .catch(e => console.error("Prefill fetch error:", e));
    }

    phoneInput.addEventListener('input', function(e) {
      let numbers = e.target.value.replace(/[^0-9]/g, '');
      if (numbers.length > 11) numbers = numbers.substring(0, 11);
      if (numbers.length <= 3) {
        e.target.value = numbers;
      } else if (numbers.length <= 7) {
        e.target.value = numbers.slice(0, 3) + '-' + numbers.slice(3);
      } else {
        e.target.value = numbers.slice(0, 3) + '-' + numbers.slice(3, 7) + '-' + numbers.slice(7);
      }
    });

    function closeDaumPostcode() {
      layerWrap.style.display = 'none';
      postcodeLayer.innerHTML = '';
    }

    function openDaumPostcode() {
      layerWrap.style.display = 'flex';
      new daum.Postcode({
        oncomplete: function(data) {
          var addr = data.roadAddress || data.jibunAddress;
          baseAddrInput.value = addr;
          detailAddrInput.value = '';
          closeDaumPostcode();
          detailAddrInput.focus();
        },
        width: '100%',
        height: '100%'
      }).embed(postcodeLayer);
    }

    document.getElementById('deliveryForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!privacyAgree.checked) {
        alert("⚠️ 개인정보 수집 및 제공에 동의해 주셔야 합니다.");
        privacyAgree.focus();
        return;
      }

      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      if (rawPhone.length !== 11 || !rawPhone.startsWith('010')) {
        alert("⚠️ 올바른 휴대폰 번호(010으로 시작, 11자리)를 입력해 주세요.");
        phoneInput.focus();
        return;
      }

      const baseAddr = baseAddrInput.value.trim();
      const detailAddr = detailAddrInput.value.trim();
      if (!baseAddr) {
        alert("⚠️ 주소를 먼저 선택해 주세요.");
        return;
      }

      const fullAddr = detailAddr ? `${baseAddr} ${detailAddr}` : baseAddr;

      submitBtn.innerText = "저장 중...";
      submitBtn.disabled = true;

      const payload = {
        kakao_user_id: kakaoUserId,
        customer_name: nameInput.value.trim(),
        phone_number: phoneInput.value.trim(),
        full_address: fullAddr
      };

      try {
        let res;
        if (isExistingCustomer) {
          // 기존 유저: UPDATE
          res = await fetch(`${SUPABASE_URL}/rest/v1/customers?kakao_user_id=eq.${encodeURIComponent(kakaoUserId)}`, {
            method: "PATCH",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify(payload)
          });
        } else {
          // 신규 유저: INSERT
          res = await fetch(`${SUPABASE_URL}/rest/v1/customers`, {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify(payload)
          });
        }

        if (res.ok) {
          alert(isExistingCustomer ? "✅ 배송 정보 변경이 완료되었습니다!\n채팅창으로 돌아가셔도 좋습니다." : "✅ 배송 정보 등록이 완료되었습니다!\n채팅창으로 돌아가셔도 좋습니다.");
          submitBtn.innerText = "완료되었습니다";
        } else {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || `오류 코드: ${res.status}`);
        }
      } catch (err) {
        alert("저장에 실패했습니다: " + err.message);
        submitBtn.disabled = false;
        submitBtn.innerText = isExistingCustomer ? "변경 완료하기" : "등록하기";
      }
    });
  </script>
</body>
</html>
