<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>배송지 등록</title>
  <!-- Daum 우편번호 서비스 -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      margin: 0;
      padding: 24px 16px;
      color: #333;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
      max-width: 440px;
      margin: 0 auto;
    }
    h2 {
      font-size: 20px;
      text-align: center;
      margin-top: 0;
      margin-bottom: 22px;
      color: #111;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    /* 플랫폼 선택 버튼 (유튜브 / 틱톡) */
    .platform-group {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
    }
    .platform-btn {
      flex: 1;
      height: 46px;
      border: 2px solid #e5e7eb;
      background: #fafafa;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #6b7280;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .platform-btn:hover {
      background: #f3f4f6;
    }
    /* 선택 활성화 스타일 */
    .platform-btn.active.yt {
      border-color: #ff0000;
      background: #fff5f5;
      color: #e60000;
    }
    .platform-btn.active.tt {
      border-color: #111;
      background: #f3f4f6;
      color: #000;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
    }
    .search-btn {
      width: 100%;
      height: 46px;
      background: #2b3445;
      color: #fff;
      border: none;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .guide-txt {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }
    .agree-box {
      background: #f9fafb;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 18px;
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #4b5563;
      cursor: pointer;
    }
    .agree-box input {
      margin-right: 8px;
      width: 18px;
      height: 18px;
      accent-color: #fee500;
      cursor: pointer;
    }
    .submit-btn {
      width: 100%;
      height: 52px;
      background: #FEE500;
      color: #191919;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(254, 229, 0, 0.4);
      transition: background 0.2s;
    }
    .submit-btn:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* 우편번호 레이어 팝업 */
    #layerWrap {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    #layerBox {
      position: relative;
      width: 92%;
      max-width: 420px;
      height: 480px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }
    #btnCloseLayer {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 30px;
      height: 30px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      line-height: 30px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="card" id="formCard">
    <!-- 제목 변경 -->
    <h2>🚚 배송지 등록</h2>
    <form id="deliveryForm">

      <!-- 1. 플랫폼 선택 (처음에는 둘 다 비활성화) -->
      <label id="platformLabel">방송 플랫폼 선택 <span style="color:#ef4444;">*</span></label>
      <div class="platform-group" id="platformArea">
        <button type="button" class="platform-btn yt" id="btnYt" onclick="selectPlatform('유튜브')">
          📺 유튜브
        </button>
        <button type="button" class="platform-btn tt" id="btnTt" onclick="selectPlatform('틱톡')">
          🎵 틱톡
        </button>
      </div>
      <input type="hidden" id="selectedPlatform" value="">

      <!-- 2. 방송 닉네임 -->
      <label>방송 닉네임 (아이디)</label>
      <input type="text" id="live_nick" placeholder="방송에서 사용하시는 닉네임" required>

      <!-- 3. 입금자명 -->
      <label>입금자명 (받으시는 분 성함)</label>
      <input type="text" id="customer_name" placeholder="홍길동" required>

      <!-- 4. 연락처 -->
      <label>연락처 (휴대폰 11자리)</label>
      <input type="tel" id="phone_number" placeholder="010-1234-5678" maxlength="13" required>

      <!-- 5. 주소 -->
      <label>주소</label>
      <button type="button" class="search-btn" onclick="openDaumPostcode()">🔍 주소 검색하기</button>
      <input type="text" id="base_address" placeholder="기본 주소가 자동 입력됩니다" readonly style="background:#f9fafb; cursor:pointer; margin-bottom:8px;" onclick="openDaumPostcode()" required>
      <input type="text" id="detail_address" placeholder="상세주소 입력 (예: 101동 202호)" required>
      <div class="guide-txt">* 정확한 배송을 위해 상세주소(동/호수)까지 꼭 적어주세요.</div>

      <!-- 개인정보 동의 -->
      <label class="agree-box">
        <input type="checkbox" id="agreeChk" checked required>
        <span>(필수) 개인정보 수집 및 배송 정보 제공에 동의합니다.</span>
      </label>

      <button type="submit" class="submit-btn" id="submitBtn">배송 정보 등록 완료</button>
    </form>
  </div>

  <!-- 우편번호 레이어 -->
  <div id="layerWrap">
    <div id="layerBox">
      <button type="button" id="btnCloseLayer" onclick="closeDaumPostcode()">✕</button>
      <div id="postcodeLayer" style="width:100%;height:100%;"></div>
    </div>
  </div>

  <script>
    // 환경 설정
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxsYWPziRp_mENdFMs1clTunTqeGzzkm6n6Xzh-hCsHTHGCHsC77lt2BknWktAt-D5KmQ/exec";
    const SUPABASE_URL = "https://utgmqhwnztpvsvnxxlsd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_KsWWBm4ekQXEo_aobNuxfA_uC6hdn5w";

    // URL 파라미터에서 식별자(?rid=스페이스.채널.방번호) 또는 ?cid= 추출
    const urlParams = new URLSearchParams(window.location.search);
    const rid = urlParams.get('rid') || "";
    const cidFallback = urlParams.get('cid') || urlParams.get('uid') || "";

    let spaceId = "10499439";
    let channelId = "_cxlBGX";
    let kakaoChatId = "";
    let fullChatRoomUrl = "";

    if (rid && rid.includes('.')) {
      const parts = rid.split('.');
      if (parts.length === 3) {
        spaceId = parts[0];
        channelId = parts[1];
        kakaoChatId = parts[2];
        fullChatRoomUrl = `https://business.kakao.com/space/${spaceId}/channel/${channelId}/chats/${kakaoChatId}`;
      }
    } else if (cidFallback) {
      kakaoChatId = cidFallback;
      fullChatRoomUrl = `https://business.kakao.com/space/${spaceId}/channel/${channelId}/chats/${kakaoChatId}`;
    }

    // 타 경로 유입 엄격 차단 검증
    if (!kakaoChatId || kakaoChatId.length < 10) {
      document.body.innerHTML = `
        <div style="text-align:center; padding: 60px 20px;">
          <h2 style="color:#d9534f; margin-bottom:15px;">⚠️ 유효하지 않은 접근입니다</h2>
          <p style="color:#666; font-size:14px; line-height:1.6;">
            카카오톡 대화방에서 발급받은 <b>전용 링크</b>로만 접속하실 수 있습니다.<br>
            대화창으로 돌아가 [🚚 배송지등록]을 다시 눌러주세요.
          </p>
        </div>
      `;
      throw new Error("비정상 유입 차단");
    }

    // 플랫폼 선택 핸들러
    function selectPlatform(platform) {
      document.getElementById('selectedPlatform').value = platform;
      const btnYt = document.getElementById('btnYt');
      const btnTt = document.getElementById('btnTt');

      if (platform === '유튜브') {
        btnYt.classList.add('active');
        btnTt.classList.remove('active');
      } else if (platform === '틱톡') {
        btnTt.classList.add('active');
        btnYt.classList.remove('active');
      }
    }

    // 우편번호 레이어 제어
    const layerWrap = document.getElementById('layerWrap');
    const postcodeLayer = document.getElementById('postcodeLayer');

    function closeDaumPostcode() {
      layerWrap.style.display = 'none';
      postcodeLayer.innerHTML = '';
    }

    function openDaumPostcode() {
      layerWrap.style.display = 'flex';
      new daum.Postcode({
        oncomplete: function(data) {
          var addr = data.roadAddress || data.jibunAddress;
          document.getElementById('base_address').value = addr;
          closeDaumPostcode();
          document.getElementById('detail_address').focus();
        },
        width: '100%',
        height: '100%'
      }).embed(postcodeLayer);
    }

    // 폼 제출 검증 및 전송
    document.getElementById('deliveryForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      // [필수 조건]: 유튜브 또는 틱톡 미선택 시 제출 차단
      const platform = document.getElementById('selectedPlatform').value;
      if (!platform) {
        alert("방송 플랫폼(유튜브 또는 틱톡)을 먼저 선택해 주세요! 😊");
        const platformArea = document.getElementById('platformArea');
        platformArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
        platformArea.style.outline = "2px solid #ef4444";
        platformArea.style.borderRadius = "12px";
        setTimeout(() => { platformArea.style.outline = "none"; }, 1500);
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerText = "안전하게 저장 중...";
      btn.disabled = true;

      const liveNick = document.getElementById('live_nick').value.trim();
      const formattedNick = `[${platform}] ${liveNick}`;

      const customerName = document.getElementById('customer_name').value.trim();
      const phoneNumber = document.getElementById('phone_number').value.trim();
      const baseAddr = document.getElementById('base_address').value.trim();
      const detailAddr = document.getElementById('detail_address').value.trim();
      const fullAddress = `${baseAddr} ${detailAddr}`.trim();

      const payload = {
        kakao_user_id: kakaoChatId,
        chat_id: kakaoChatId,
        kakao_chat_url: fullChatRoomUrl,
        customer_name: customerName,
        phone_number: phoneNumber,
        full_address: fullAddress,
        youtube_id: formattedNick,
        platform: platform,
        updated_at: new Date().toISOString()
      };

      try {
        // 1. Supabase DB 저장
        await fetch(`${SUPABASE_URL}/rest/v1/customers`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "resolution=merge-duplicates"
          },
          body: JSON.stringify(payload)
        }).catch(() => null);

        // 2. Google Apps Script 구글 시트 저장
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).catch(() => null);

        alert("✅ 배송 정보 등록이 완료되었습니다!\n카카오톡 대화방으로 돌아가셔도 좋습니다.");
        btn.innerText = "등록 완료됨";
      } catch (err) {
        alert("등록 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
        btn.disabled = false;
        btn.innerText = "배송 정보 등록 완료";
      }
    });
  </script>
</body>
</html>
