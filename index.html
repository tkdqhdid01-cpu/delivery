<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRuDek3HVGltp_HM3_FRT0M8aWYVv6tlqfgoQb4xOciIzFrBKVDWPcT5kdXyU28efbqg/exec";

    // (중략... 폼 제출 부분)
    document.getElementById('deliveryForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      // ... 유효성 검사 생략 ...

      const payload = {
        kakao_user_id: kakaoUserId,
        customer_name: customerName,
        phone_number: phoneVal,
        full_address: fullAddress,
        youtube_id: ytNick
      };

      try {
        // 오직 구글 시트로만 직행!
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("✅ 배송 정보 등록이 완료되었습니다!\n채팅창으로 돌아가셔도 좋습니다 😊");
      } catch (err) {
        alert("일시적인 오류가 발생했습니다.");
      }
    });
  </script>
